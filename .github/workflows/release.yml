name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package or republish (for example v0.1.106)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release source
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${PACKAGE_VERSION}." >&2
            exit 1
          fi
          git fetch origin +main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${RELEASE_TAG} is not contained in origin/main." >&2
            exit 1
          fi
          echo "name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack check
        run: npm run pack:check

      - name: Create npm package artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > "${RUNNER_TEMP}/npm-pack.json"
          TARBALL="$(node -e '
            const fs = require("fs");
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const candidate = Array.isArray(parsed) ? parsed[0] : parsed;
            const metadata = candidate && typeof candidate.filename === "string"
              ? candidate
              : candidate && typeof candidate === "object"
                ? Object.values(candidate)[0]
                : null;
            if (!metadata || typeof metadata.filename !== "string") {
              throw new Error("npm pack returned invalid filename metadata");
            }
            process.stdout.write(metadata.filename);
          ' "${RUNNER_TEMP}/npm-pack.json")"
          test -f "${TARBALL}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Store release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  github-release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: npm-package-${{ needs.package.outputs.version }}
          path: release-artifact

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: release-artifact/${{ needs.package.outputs.tarball }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${TARBALL}" "${TARBALL}.sha256" \
              --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "${TARBALL}" "${TARBALL}.sha256" \
              --verify-tag --generate-notes --title "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: GitHub Release summary
        env:
          PACKAGE_NAME: ${{ needs.package.outputs.name }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          {
            echo "## GitHub Release ${RELEASE_TAG}"
            echo ""
            echo "- Package: \`${PACKAGE_NAME}@${PACKAGE_VERSION}\`"
            echo "- Artifact: \`${TARBALL}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  npm-publish:
    needs:
      - package
      - github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node for npm
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Download release artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: npm-package-${{ needs.package.outputs.version }}
          path: release-artifact

      - name: Detect npm publishing secret
        id: npm_auth
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "NPM_TOKEN is configured; npm publishing is enabled."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "NPM_TOKEN is not configured; keeping this as a GitHub Release only."
          fi

      - name: Check whether npm version already exists
        id: npm_version
        if: steps.npm_auth.outputs.available == 'true'
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.package.outputs.name }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package to npm
        if: steps.npm_auth.outputs.available == 'true' && steps.npm_version.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: release-artifact/${{ needs.package.outputs.tarball }}
        run: npm publish "${GITHUB_WORKSPACE}/${TARBALL}" --access public --provenance --ignore-scripts

      - name: npm publishing summary
        if: always()
        env:
          PACKAGE_NAME: ${{ needs.package.outputs.name }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          NPM_ENABLED: ${{ steps.npm_auth.outputs.available }}
          NPM_EXISTS: ${{ steps.npm_version.outputs.exists }}
        run: |
          {
            echo "## npm publishing"
            echo ""
            echo "- Package: \`${PACKAGE_NAME}@${PACKAGE_VERSION}\`"
            echo "- NPM_TOKEN configured: \`${NPM_ENABLED:-false}\`"
            echo "- Version already existed: \`${NPM_EXISTS:-false}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
